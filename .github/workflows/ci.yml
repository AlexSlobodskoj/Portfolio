name: CI

on:
  push:

jobs:
  # ─────────────────────────────────────────
  # 1. Python linting
  # ─────────────────────────────────────────
  lint:
    name: Lint Python (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check airflow/dags/

  # ─────────────────────────────────────────
  # 2. DAG integrity check
  # ─────────────────────────────────────────
  dag-integrity:
    name: DAG import check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Airflow
        run: |
          pip install "apache-airflow==2.9.3" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.9.3/constraints-3.11.txt"

      - name: Check DAGs import without errors
        env:
          AIRFLOW_HOME: /tmp/airflow
        run: |
          airflow db migrate 2>/dev/null
          python -c "
          import os, sys
          from airflow.models import DagBag

          dag_folder = 'airflow/dags'
          bag = DagBag(dag_folder=dag_folder, include_examples=False)

          if bag.import_errors:
              for path, error in bag.import_errors.items():
                  print(f'ERROR in {path}:\n{error}')
              sys.exit(1)

          print(f'OK — {len(bag.dags)} DAG(s) imported successfully')
          "

  # ─────────────────────────────────────────
  # 3. Discover dbt projects dynamically
  # ─────────────────────────────────────────
  discover-dbt:
    name: Discover dbt projects
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4

      - name: Build matrix from dbt-project subfolders
        id: set-matrix
        run: |
          # Find all subdirectories of dbt-project/ that contain dbt_project.yml
          projects=$(find dbt-project -mindepth 1 -maxdepth 1 -type d \
            -exec test -f '{}/dbt_project.yml' \; -print \
            | sort \
            | jq -R . | jq -sc .)
          echo "matrix={\"project\":$projects}" >> $GITHUB_OUTPUT
          echo "Found projects: $projects"

  # ─────────────────────────────────────────
  # 4. dbt parse — one job per project
  # ─────────────────────────────────────────
  dbt-parse:
    name: dbt parse — ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: discover-dbt
    strategy:
      matrix: ${{ fromJson(needs.discover-dbt.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-core dbt-postgres

      - name: dbt parse
        working-directory: ${{ matrix.project }}
        env:
          # dbt requires profiles.yml for parse but does not connect to a real DB.
          # Dummy credentials are used — parse only validates SQL, no connection is made.
          DBT_PROFILES_DIR: .
        run: |
          # Read profile name from dbt_project.yml and create matching profiles.yml
          profile=$(grep '^profile:' dbt_project.yml | sed "s/profile: *['\"]//;s/['\"].*//")
          echo "Profile name: $profile"

          # Install dbt package dependencies if packages.yml exists
          if [ -f packages.yml ]; then
            dbt deps --profiles-dir .
          fi

          cat > profiles.yml << EOF
          ${profile}:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                user: ci
                password: ci
                port: 5432
                dbname: ci
                schema: ci
                threads: 1
          EOF

          dbt parse --profiles-dir . --target ci